name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # 1. Main App
      - name: Install Main App Dependencies
        run: bun install

      - name: Build Main App
        run: bun run build
        env:
          CI: false

      # 2. Documentation
      - name: Install Docs Dependencies
        working-directory: ./documentation
        run: npm ci

      - name: Build Docs
        working-directory: ./documentation
        run: npm run build

      # 3. Merge
      - name: Merge Documentation into Build
        run: mv documentation/build dist/documentation || true

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
